version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint (pulled in by eslint-config-next) declares
      # `typescript: '>=4.8.4 <6.1.0'`. TypeScript 7 makes `eslint` fail to
      # start with "typescript-eslint does not support TS 7.0", which takes down
      # the whole frontend lint job. Raise this ceiling once typescript-eslint
      # ships TS 7 support.
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: [">=7.0.0"]

      # ESLint 10 removed `context.getFilename()`, which the eslint-plugin-react
      # bundled in eslint-config-next still calls. Lint dies on the first rule
      # load with "contextOrFilename.getFilename is not a function".
      # eslint-config-next is already at its latest release (16.3.8), so there
      # is no version to upgrade into. Raise this ceiling once
      # eslint-config-next ships an ESLint 10 compatible plugin.
      - dependency-name: eslint
        versions: [">=10.0.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
