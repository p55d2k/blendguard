[project]
name = "blendguard-backend"
version = "0.1.0"
description = "Transparent Black-Litterman ETF portfolio optimizer API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "numpy>=2.2",
    "pandas>=2.2",
    "scipy>=1.15",
    "pyportfolioopt>=1.5.5",
    "cvxpy>=1.6",
    "httpx>=0.28",
]

[project.optional-dependencies]
# NOTE: Production market data providers are added here as
# their licenses are secured. Free sources (yfinance, stooq) are deliberately
# not pre-declared — a provider must be explicitly chosen and licensed.
#
# NOTE: Bloomberg's `blpapi` is NOT on PyPI and is therefore intentionally
# absent here. Install it manually from Bloomberg's package index:
#
#   uv pip install --index-url https://blpapi.bloomberg.com/repository/Python-packages \
#     --extra-index-url https://pypi.org/simple blpapi
#
# It must never be a production dependency. See docs/architecture.md.

[project.scripts]
blendguard = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.14",
    "pandas-stubs>=2.2",
]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.uv]
package = true
environments = ["python_full_version >= '3.12' and python_full_version < '3.14'"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running or data-dependent tests",
    "integration: requires market data / network",
    "bloomberg: requires Bloomberg Desktop API (development only)",
]
filterwarnings = [
    "ignore::DeprecationWarning:cvxpy.*",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtin shadowing
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501", # line length handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = []
exclude = ['^data/', '^\\.venv/']

[[tool.mypy.overrides]]
module = ["pandas.*", "numpy.*", "cvxpy.*", "pypfopt.*", "blpapi.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["app"]
omit = ["app/providers/bloomberg.py"]
